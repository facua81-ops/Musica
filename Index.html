<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Entrenamiento Auditivo</title>
    <style>
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        header { text-align: center; margin: 16px 0; }
        h1 { color: #818cf8; font-size: 1.8rem; margin: 0; font-weight: bold; }
        header p { color: #9ca3af; font-size: 0.875rem; margin-top: 4px; }
        
        /* Pestañas de Navegación */
        .tabs { display: flex; gap: 8px; width: 100%; max-width: 400px; margin-bottom: 16px; }
        .tab-btn { flex: 1; background-color: #374151; color: #9ca3af; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .tab-btn.active { background-color: #4f46e5; color: white; }

        main {
            width: 100%;
            max-width: 400px;
            background-color: #1f2937;
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            border: 1px solid #374151;
        }
        .module-section { display: none; }
        .module-section.active { display: block; }

        .flex-gap { display: flex; gap: 16px; margin-bottom: 24px; }
        .w-1/2 { width: 50%; }
        label { display: block; font-size: 0.75rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; margin-bottom: 8px; }
        select {
            width: 100%;
            background-color: #374151;
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .panel-audio {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid #374151;
            margin-bottom: 24px;
        }
        .panel-audio span { display: block; font-size: 0.75rem; color: #a5b4fc; font-family: monospace; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
        .btn-main {
            width: 100%;
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }
        .btn-main:active { transform: scale(0.98); background-color: #4338ca; }
        .status-text { color: #9ca3af; font-size: 0.875rem; margin-top: 12px; margin-bottom: 0; font-style: italic; }
        .space-y { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            width: 100%;
            background-color: #374151;
            border: 1px solid transparent;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: background 0.15s;
        }
        .option-btn:hover { background-color: #4b5563; }
        .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .intervals-tag { font-family: monospace; font-size: 0.75rem; color: #9ca3af; }
        .feedback { margin-top: 24px; text-align: center; font-weight: bold; font-size: 1.125rem; padding: 12px; border-radius: 12px; display: none; }
        .bg-correct { display: block !important; background-color: rgba(6, 78, 59, 0.5); color: #34d399; border: 1px solid #065f46; }
        .bg-incorrect { display: block !important; background-color: rgba(153, 27, 27, 0.5); color: #f87171; border: 1px solid #991b1b; }
        footer { margin-top: auto; padding: 16px 0; font-size: 0.75rem; color: #6b7280; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Entrenamiento Auditivo</h1>
        <p>Tu laboratorio musical de estudio</p>
    </header>

    <!-- Control de Pestañas -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchModule('mod-escalas')">Escalas Menores</button>
        <button class="tab-btn" onclick="switchModule('mod-funciones')">Tónica / Dominante</button>
    </div>

    <main>
        <!-- Selectores Globales de Tonalidad -->
        <div class="flex-gap">
            <div class="w-1/2">
                <label>Nota Raíz</label>
                <select id="root-note">
                    <option value="A">La (A)</option>
                    <option value="C">Do (C)</option>
                    <option value="D">Re (D)</option>
                    <option value="E">Mi (E)</option>
                    <option value="G">Sol (G)</option>
                </select>
            </div>
            <div class="w-1/2">
                <label>Octava</label>
                <select id="octave">
                    <option value="3">Octava 3</option>
                    <option value="4" selected>Octava 4</option>
                </select>
            </div>
        </div>

        <!-- MÓDULO 1: RECONOCIMIENTO DE ESCALAS -->
        <div id="mod-escalas" class="module-section active">
            <div class="panel-audio">
                <span>Módulo de Escalas Menores</span>
                <button class="btn-main" id="btn-play-scales">🔊 Escuchar Escala Aleatoria</button>
                <p class="status-text" id="status-scales">Presiona el botón para empezar la trivia.</p>
            </div>
            <div>
                <label style="margin-bottom: 12px;">¿Qué escala escuchaste?</label>
                <div class="space-y">
                    <button class="option-btn scale-opt" data-type="natural">
                        <span>Escala Menor Natural</span>
                        <span class="intervals-tag">1 2 ♭3 4 5 ♭6 ♭7</span>
                    </button>
                    <button class="option-btn scale-opt" data-type="harmonica">
                        <span>Escala Menor Armónica</span>
                        <span class="intervals-tag">1 2 ♭3 4 5 ♭6 7</span>
                    </button>
                    <button class="option-btn scale-opt" data-type="melodica">
                        <span>Escala Menor Melódica</span>
                        <span class="intervals-tag">1 2 ♭3 4 5 6 7</span>
                    </button>
                </div>
            </div>
            <div class="feedback" id="feedback-scales"></div>
        </div>

        <!-- MÓDULO 2: TÓNICA Y DOMINANTE -->
        <div id="mod-funciones" class="module-section">
            <div class="panel-audio">
                <span>Módulo Funciones Armónicas</span>
                <button class="btn-main" id="btn-play-functions">🔊 Escuchar Grado Aleatorio</button>
                <p class="status-text" id="status-functions">Se tocará una guía corta y luego la nota misteriosa.</p>
            </div>
            <div>
                <label style="margin-bottom: 12px;">¿Qué función cumple la última nota?</label>
                <div class="space-y">
                    <button class="option-btn func-opt" data-type="tonica">
                        <span>Tónica / Reposo</span>
                        <span class="intervals-tag">Grado I (Estable)</span>
                    </button>
                    <button class="option-btn func-opt" data-type="dominante">
                        <span>Dominante / Tensión</span>
                        <span class="intervals-tag">Grado V (Inestable)</span>
                    </button>
                </div>
            </div>
            <div class="feedback" id="feedback-functions"></div>
        </div>
    </main>

    <footer>
        Desarrollo Nativo • El oído se entrena con consistencia diaria.
    </footer>

    <script>
        const noteFrequencies = {
            "C": 261.63, "D": 293.66, "E": 329.63, "G": 392.00, "A": 440.00
        };

        const scaleIntervals = {
            natural:, harmonica:, melodica:
        };

        let currentScaleType = ""; 
        let currentFuncType = "";
        let isPlaying = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(frequency, startTime, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = "triangle";
            osc.frequency.setValueAtTime(frequency, startTime);
            
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration - 0.02);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(startTime);
            osc.stop(startTime + duration);
        }
