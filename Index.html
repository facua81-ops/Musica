<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Entrenamiento Auditivo</title>
    <!-- Tone.js cargado de forma segura -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        header { text-align: center; margin: 24px 0; }
        h1 { color: #818cf8; font-size: 1.8rem; margin: 0; font-weight: bold; }
        header p { color: #9ca3af; font-size: 0.875rem; margin-top: 4px; }
        main {
            width: 100%;
            max-width: 400px;
            background-color: #1f2937;
            border-radius: 16px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            border: 1px solid #374151;
        }
        .flex-gap { display: flex; gap: 16px; margin-bottom: 24px; }
        .w-1/2 { width: 50%; }
        label { display: block; font-size: 0.75rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; margin-bottom: 8px; }
        select {
            width: 100%;
            background-color: #374151;
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .panel-audio {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid #374151;
            margin-bottom: 24px;
        }
        .panel-audio span { display: block; font-size: 0.75rem; color: #a5b4fc; font-family: monospace; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
        #btn-play {
            width: 100%;
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }
        #btn-play:active { transform: scale(0.98); background-color: #4338ca; }
        #status-text { color: #9ca3af; font-size: 0.875rem; margin-top: 12px; margin-bottom: 0; font-style: italic; }
        .space-y { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            width: 100%;
            background-color: #374151;
            border: 1px solid transparent;
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            transition: background 0.15s;
        }
        .option-btn:hover { background-color: #4b5563; }
        .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .intervals-tag { font-family: monospace; font-size: 0.75rem; color: #9ca3af; }
        #feedback { margin-top: 24px; text-align: center; font-weight: bold; font-size: 1.125rem; padding: 12px; border-radius: 12px; display: none; }
        .bg-correct { display: block !important; background-color: rgba(6, 78, 59, 0.5); color: #34d399; border: 1px solid #065f46; }
        .bg-incorrect { display: block !important; background-color: rgba(153, 27, 27, 0.5); color: #f87171; border: 1px solid #991b1b; }
        footer { margin-top: auto; padding: 16px 0; font-size: 0.75rem; color: #6b7280; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Entrenamiento Auditivo</h1>
        <p>Módulo 1: Reconocimiento de Escalas Menores</p>
    </header>

    <main>
        <div class="flex-gap">
            <div class="w-1/2">
                <label>Nota Raíz</label>
                <select id="root-note">
                    <option value="A">La (A)</option>
                    <option value="C">Do (C)</option>
                    <option value="D">Re (D)</option>
                    <option value="E">Mi (E)</option>
                    <option value="G">Sol (G)</option>
                </select>
            </div>
            <div class="w-1/2">
                <label>Octava</label>
                <select id="octave">
                    <option value="3">Octava 3</option>
                    <option value="4" selected>Octava 4</option>
                </select>
            </div>
        </div>

        <div class="panel-audio">
            <span>Generador de Escalas</span>
            <!-- Corregido a evento onclick directo para cumplir con la política de seguridad móvil -->
            <button id="btn-play" onclick="playScale()">🔊 Escuchar Escala Aleatoria</button>
            <p id="status-text">Presiona el botón para empezar la trivia.</p>
        </div>

        <div>
            <label style="margin-bottom: 12px;">¿Qué escala escuchaste?</label>
            <div class="space-y">
                <button onclick="checkAnswer('natural')" class="option-btn">
                    <span>Escala Menor Natural</span>
                    <span class="intervals-tag">1 2 ♭3 4 5 ♭6 ♭7</span>
                </button>
                <button onclick="checkAnswer('harmonica')" class="option-btn">
                    <span>Escala Menor Armónica</span>
                    <span class="intervals-tag">1 2 ♭3 4 5 ♭6 7</span>
                </button>
                <button onclick="checkAnswer('melodica')" class="option-btn">
                    <span>Escala Menor Melódica</span>
                    <span class="intervals-tag">1 2 ♭3 4 5 6 7</span>
                </button>
            </div>
        </div>

        <div id="feedback"></div>
    </main>

    <footer>
        Desarrollo Base MVP • Asegúrate de desactivar el modo silencio de tu móvil.
    </footer>

    <script>
        // Configuración del sintetizador básico
        const synth = new Tone.Synth({
            oscillator: { type: "triangle" }, 
            envelope: { attack: 0.05, decay: 0.1, sustain: 0.7, release: 0.3 }
        }).toDestination();

        const scaleIntervals = {
            natural:,
            harmonica:,
            melodica:
        };

        let currentScaleType = ""; 
        let isPlaying = false;

        async function playScale() {
            if (isPlaying) return;
            
            try {
                // Forzar el inicio y desbloqueo del contexto de audio web en el navegador móvil
                await Tone.start();
                if (Tone.context.state !== 'running') {
                    await Tone.context.resume();
                }
                
                resetUI();

                const types = ['natural', 'harmonica', 'melodica'];
                currentScaleType = types[Math.floor(Math.random() * types.length)];

                const root = document.getElementById('root-note').value;
                const octave = parseInt(document.getElementById('octave').value);
                const baseFrequency = Tone.Frequency(`${root}${octave}`).toFrequency();

                const intervals = scaleIntervals[currentScaleType];
                const notesToPlay = intervals.map(semi => baseFrequency * Math.pow(2, semi / 12));

                isPlaying = true;
                document.getElementById('status-text').innerText = "Reproduciendo escala...";
                toggleButtons(true);

                let now = Tone.now();
                notesToPlay.forEach((freq, index) => {
                    synth.triggerAttackRelease(freq, "4n", now + (index * 0.4));
                });

                setTimeout(() => {
                    isPlaying = false;
                    document.getElementById('status-text').innerText = "¡Listo! Elige tu respuesta abajo.";
                    toggleButtons(false);
                }, notesToPlay.length * 400);

            } catch (error) {
                document.getElementById('status-text').innerText = "Error de audio. Reintenta.";
                console.error(error);
                isPlaying = false;
                toggleButtons(false);
            }
        }

        function checkAnswer(selectedType) {
            if (!currentScaleType) {
                alert("Primero debes escuchar una escala presionando el botón de arriba.");
                return;
            }

            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.className = ""; 

            if (selectedType === currentScaleType) {
                feedbackDiv.innerText = "¡Correcto! Es una escala menor " + translateType(currentScaleType);
                feedbackDiv.classList.add('bg-correct');
            } else {
                feedbackDiv.innerText = "Incorrecto. Era una escala menor " + translateType(currentScaleType);
                feedbackDiv.classList.add('bg-incorrect');
            }
        }

        function translateType(type) {
            if(type === 'natural') return 'Natural';
            if(type === 'harmonica') return 'Armónica';
            return 'Melódica';
        }

        function resetUI() {
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.style.display = 'none';
            feedbackDiv.className = "";
        }

        function toggleButtons(disabled) {
